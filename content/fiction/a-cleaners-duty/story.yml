title: A Cleaner's Duty
genre: Steampunk, mystery
status: Complete
published: 2026-03
hook: A routine sweep of the north turns up an outpost stripped clean and a note somebody hid.
blurb: |
  Three days into a routine sweep of the north, Thomas Spaulder and his squad find an outpost stripped clean and a note somebody hid rather than sent.

  What should be a burn-and-log job becomes a walk into a facility that isn't supposed to exist, built to turn the Sprawl into a weapon and desperate farmers into its carriers.
