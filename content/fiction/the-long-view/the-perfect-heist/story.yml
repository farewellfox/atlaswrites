title: The Perfect Heist
number: 1
genre: Fantasy, heist
status: Complete
published: 2026-07
hook: A thief who walked out of the Accord comes back to rob the Pendleton vault.
blurb: |
  Five years after walking out of the Accord, the criminal organization nobody walks out of, he's back in Merranth with a bag of stolen trinkets, a frozen debt, and a scheme to rob the Pendleton vault during the Royal Procession.

  He needs a crew. An old partner who hasn't worked in a decade. A woman who's smarter than him and won't let him forget it. And the backing of the most dangerous man in Merranth, who wants something in return that Tav isn't ready to give.
