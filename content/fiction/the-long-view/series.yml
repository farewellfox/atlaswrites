title: The Long View
genre: Fantasy
status: Ongoing series
hook: His father died for a painting. Tav wants to stand where it was painted.
blurb: |
  In Merranth, everything is owned. The docks belong to the Patrons, the debts to the Accord, and the law to whoever can afford it.

  Tavish Derring keeps a trinket from every job, in memory of the father who taught him the trade and died for a landscape. Somewhere in Thestria is the view that painting shows. Tav means to stand in it.

  He isn't the only one taking the long view.