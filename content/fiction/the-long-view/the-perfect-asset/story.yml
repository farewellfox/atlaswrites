title: The Perfect Asset
number: 2
genre: Fantasy, heist
status: In Progress
published: 2026-10
hook: They caught the perfect thief. Now they want him working.
blurb: |
  Five days after the perfect heist, Tav is in a Crown cell, sold out by a friend and missing a ring he keeps reaching for. He's learned his lesson: the dead can't betray you. Special Investigations doesn't want him locked up. They want him working.

  So Tav becomes their perfect asset, with the man who sold him as his handler, Sayd and Maddy close by, and Lord Casvern at the top of every road. Somewhere in Thestria is the view from his father's painting, and Tav means to find it, even if he has to serve two masters to get there.