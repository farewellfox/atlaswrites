blurb: |
 Six months ago, Atlas Grey trusted the wrong friend. Now the city thinks he's dead, and he'd like to keep it that way. To stay buried he needs work, and the only man in the Undercity who might hire him is one he once dragged to the Watchhouse in cuffs.

 The Mentor has a job for him, and one condition: you don't ask why until it's done.
