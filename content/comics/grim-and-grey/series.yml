title: Grim & Grey
genre: Fantasy noir
status: Ongoing series
hook: A city built around a hole, a dead man who'd like to stay that way, and the gun only he can hear.
blurb: |
  Strathen is a tiered city built around a hole. Half a million people live in and around a giant pit, open to the sky. The rich live above it on pillars of old stone, under electric light. Below the Rim, Lowertown is cut into the pit walls, lit by gas and choked with coal smoke. Under all of it are the mines, and something in the ore hums. Work near it long enough and it seeps into you. Most people it only kills. A few, it changes.

  Keep him breathing.
note: Art is in progress. The finished pages may be posted here as a web comic.
