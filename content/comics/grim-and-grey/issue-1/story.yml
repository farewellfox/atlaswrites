blurb: |
  Six months ago, Atlas Grey trusted the wrong friend. Now the city thinks he's dead, and he'd like to keep it that way. To stay buried he needs work, and the only man in Lowertown who might hire him is one he once apprehended.

  He's not alone, though. Grim, his gun (yeah, he talks), is along for the ride. Only Atlas can hear him, and he has opinions about everything Atlas does.

  The Mentor has a job for him and only one condition: he doesn't ask why until it's done.
